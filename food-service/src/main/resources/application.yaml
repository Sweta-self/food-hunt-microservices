server:
  port: 8082

spring:
  application:
    name: food-service

  datasource:
    url: jdbc:mysql://localhost:3306/food_hunt
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resource server:
        jwt:
          issuer-uri: https://dev-acun87tlm2zqnkn3.us.auth0.com/

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.security: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents

  endpoint:
    health:
      show-details: always

resilience4j:
  retry:
    instances:
      reviewService:
        max-attempts: 3
        wait-duration: 30s
        retry-on-exceptions:
          - feign.FeignException        
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

  circuitbreaker:
    instances:
      reviewService:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2